<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white max-w-sm w-full p-8 rounded-2xl shadow-sm border border-gray-200">
        
        <!-- Header -->
        <div class="mb-8">
            <div class="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center mb-4">
                <span class="material-symbols-outlined text-gray-700">shield_lock</span>
            </div>
            <h1 class="text-xl font-bold text-gray-900 tracking-tight">Basicsy Admin Login</h1>
            <p class="text-sm text-gray-500 mt-1">Por favor escribe tu contraseña, o pidele a tu novio que te la recuerde 😜</p>
        </div>

        <!-- Form -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-2">Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-lg">key</span>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-10 pr-4 py-3 text-sm text-gray-900 focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none transition-all placeholder-gray-400">
                </div>
                <p id="error-msg" class="text-red-500 text-xs font-medium mt-2 hidden">Contraseña incorrecta! Intenta de nuevo.</p>
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-gray-900 text-white text-sm font-semibold py-3.5 rounded-xl hover:bg-black transition-colors flex justify-center items-center gap-2">
                <span>Iniciar Sesión</span>
                <span class="material-symbols-outlined text-sm">login</span>
            </button>
        </form>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const password = document.getElementById("password").value;
            const btn = document.getElementById("submitBtn");
            const errorMsg = document.getElementById("error-msg");

            // UI Loading state
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-sm">progress_activity</span> <span>Authenticating...</span>`;
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch("/api/admin-login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    btn.innerHTML = `<span class="material-symbols-outlined text-sm">check</span> <span>Success</span>`;
                    btn.classList.replace('bg-gray-900', 'bg-green-600');
                    btn.classList.replace('hover:bg-black', 'hover:bg-green-700');
                    
                    // Brief delay so the user sees the success state before redirecting
                    setTimeout(() => {
                        window.location.href = "/admin.html";
                    }, 400);
                } else {
                    // Show error and reset button
                    errorMsg.classList.remove('hidden');
                    document.getElementById("password").value = '';
                    document.getElementById("password").focus();
                    
                    btn.disabled = false;
                    btn.innerHTML = `<span>Sign In</span> <span class="material-symbols-outlined text-sm">login</span>`;
                }
            } catch (err) {
                errorMsg.innerText = "Connection error. Please try again.";
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = `<span>Sign In</span> <span class="material-symbols-outlined text-sm">login</span>`;
            }
        });
    </script>
</body>
</html>
