<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Product Catalog</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #fdfdfd; padding: 40px; color: #333; }
        h1 { text-align: center; margin-bottom: 40px; }
        
        /* This sets up a clean, responsive product grid */
        .catalog-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 30px; 
            max-width: 1100px; 
            margin: 0 auto; 
        }
        
        .product-card { 
            background: white; 
            border: 1px solid #eee; 
            border-radius: 8px; 
            padding: 16px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
        }
        
        .product-image { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; /* Keeps images crisp without distortion */
            border-radius: 4px; 
            background: #f0f0f0;
        }
        
        .product-title { font-size: 18px; margin: 15px 0 8px 0; font-weight: bold; }
        .product-price { font-size: 16px; color: #000; font-weight: 600; margin-bottom: 10px; }
        .buy-button { background: #000; color: #fff; text-align: center; padding: 10px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 14px; margin-top: auto; }
    </style>
</head>
<body>

    <h1>Product Catalog</h1>

    <!-- Our JavaScript will inject the products right inside this container -->
    <div class="catalog-grid" id="catalogContainer">
        <p style="text-align: center; color: gray;">Loading products...</p>
    </div>

    <script>
        async function loadStorefrontCatalog() {
            const container = document.getElementById('catalogContainer');
            
            try {
                // Fetch our array data from our new endpoint
                const response = await fetch('/api/get-catalog');
                const products = await response.json();

                if (products.length === 0) {
                    container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: gray;">No products available yet.</p>`;
                    return;
                }

                // Clear out the "Loading..." text
                container.innerHTML = '';

                // Loop through every item in your json list and construct the HTML card
                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    card.innerHTML = `
                        <!-- product.image points perfectly to your unique Vercel Blob suffix link -->
                        <img src="${product.image}" class="product-image" alt="${product.name}">
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                        <a href="#" class="buy-button">View Product</a>
                    `;
                    
                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Error rendering catalog:', error);
                container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: red;">Failed to load catalog.</p>`;
            }
        }

        // Run this function immediately when the page finishes loading
        window.addEventListener('DOMContentLoaded', loadStorefrontCatalog);
    </script>
</body>
</html>
